name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v0.1.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish version-only release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $VERSION" >&2; exit 1 ;;
          esac
          git fetch --tags --force
          git rev-parse "$VERSION" >/dev/null
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
